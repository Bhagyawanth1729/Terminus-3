schema: fleet-service-catalog/v1
services:
- name: checkout
  owner: platform-commerce
  port: 8080
  replicas: 2
  health:
    path: /health/ready
    interval_seconds: 10
    timeout_seconds: 2
    success_threshold: 1
    failure_threshold: 3
  resources:
    cpu_millicores: 250
    memory_mb: 256
    max_connections: 200
  dependencies:
  - catalog
  - pricing
  - inventory
  - payments
  - identity
  sites: [blr, maa, hyd]
  environments: [all]
  routing: {protocol: grpc, sticky: true, retry_count: 1, circuit_breaker_threshold: 20}
  telemetry: {metrics_path: /metrics, tracing_sample_rate: 0.05, log_level: info}
- name: catalog
  owner: platform-money
  port: 8081
  replicas: 3
  health: {path: /health/ready, interval_seconds: 15, timeout_seconds: 3, success_threshold: 1, failure_threshold: 4}
  resources: {cpu_millicores: 350, memory_mb: 384, max_connections: 250}
  dependencies: []
  sites: [all]
  environments: [all]
  routing: {protocol: http, sticky: false, retry_count: 2, circuit_breaker_threshold: 25}
  telemetry: {metrics_path: /metrics, tracing_sample_rate: 0.1, log_level: warn}
