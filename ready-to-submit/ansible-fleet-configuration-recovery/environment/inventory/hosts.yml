all:
  vars:
    ansible_connection: local
    fleet_environment: prod
    fleet_runtime_root: /tmp/fleet-runtime
  children:
    blr:
      hosts:
        blr-app-01:
          ansible_host: 10.40.10.11
          telemetry_address: 2001:db8:40::11
          fleet_services:
            checkout:
              endpoint:
                host: 2001:db8:40::11
                port: 8080
                weight: 20
                zone: blr-a
                protocol: http
        blr-app-02:
          ansible_host: 10.40.10.12
          telemetry_address: 10.40.10.12
          fleet_services:
            checkout: 10.40.10.12:8080
        blr-proxy-01:
          ansible_host: 10.40.20.11
        blr-db-01:
          ansible_host: 10.40.30.11
    maa:
      hosts:
        maa-app-01:
          ansible_host: 10.50.10.11
          telemetry_address: 2001:db8:50::11
          fleet_services:
            checkout:
              endpoint:
                host: 2001:db8:50::11
                port: 8080
                weight: 30
                zone: maa-a
                protocol: http
        maa-app-02:
          ansible_host: 10.50.10.12
          fleet_services:
            checkout:
              host: 10.50.10.12
              port: 8080
              weight: 20
              zone: maa-b
              protocol: http
        maa-proxy-01:
          ansible_host: 10.50.20.11
        maa-db-01:
          ansible_host: 10.50.30.11
    hyd:
      hosts:
        hyd-app-01:
          ansible_host: 10.60.10.11
          fleet_services:
            checkout:
              endpoint:
                host: 10.60.10.11
                port: 8080
                weight: 25
                zone: hyd-a
                protocol: http
        hyd-app-02:
          ansible_host: 10.60.10.12
          fleet_services:
            checkout:
              endpoint:
                host: 10.60.10.12
                port: 8080
                weight: 25
                zone: hyd-b
                protocol: http
        hyd-proxy-01:
          ansible_host: 10.60.20.11
        hyd-db-01:
          ansible_host: 10.60.30.11
    application_nodes:
      children:
        blr-apps:
          hosts:
            blr-app-01:
            blr-app-02:
        maa-apps:
          hosts:
            maa-app-01:
            maa-app-02:
        hyd-apps:
          hosts:
            hyd-app-01:
            hyd-app-02:
    proxy_nodes:
      hosts:
        blr-proxy-01:
        maa-proxy-01:
        hyd-proxy-01:
    database_nodes:
      hosts:
        blr-db-01:
        maa-db-01:
        hyd-db-01:
