apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-upload-api
  namespace: claims-upload
  labels:
    app.kubernetes.io/name: claims-upload
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: claims-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: claims-upload
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claims-upload
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: claims-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: claims-upload
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: claims-upload
                  app.kubernetes.io/component: api
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: registry.example.local/claims-upload:1.8.4
          command: ["/app/bin/claims-upload", "serve"]
          envFrom:
            - configMapRef:
                name: claims-upload-config
            - secretRef:
                name: claims-upload-secret
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: upload-data
              mountPath: /var/claims/uploads
            - name: tmp
              mountPath: /tmp
        - name: log-forwarder
          image: registry.example.local/vector:0.34.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: upload-data
          persistentVolumeClaim:
            claimName: claims-upload-data
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: claims-upload-api
  namespace: claims-upload
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: claims-upload
      app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: claims-upload-api
  namespace: claims-upload
  labels:
    app.kubernetes.io/name: claims-upload
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: claims-upload
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
