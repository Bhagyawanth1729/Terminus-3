apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-upload-worker
  namespace: claims-upload
  labels:
    app.kubernetes.io/name: claims-upload
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: claims-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: claims-upload
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claims-upload
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: claims-platform
    spec:
      serviceAccountName: claims-upload
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: registry.example.local/claims-upload:1.8.4
          command: ["/app/bin/claims-upload", "worker"]
          envFrom:
            - configMapRef:
                name: claims-upload-config
            - secretRef:
                name: claims-upload-secret
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: upload-data
              mountPath: /var/claims/uploads
            - name: tmp
              mountPath: /tmp
        - name: log-forwarder
          image: registry.example.local/vector:0.34.1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: upload-data
          persistentVolumeClaim:
            claimName: claims-upload-data
        - name: tmp
          emptyDir: {}
