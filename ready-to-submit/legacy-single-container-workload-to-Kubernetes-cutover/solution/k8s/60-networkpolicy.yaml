apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claims-upload-api-ingress
  namespace: claims-upload
  labels:
    app.kubernetes.io/name: claims-upload
    app.kubernetes.io/part-of: claims-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: claims-upload
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: claims-upload
              app.kubernetes.io/component: proxy
      ports:
        - protocol: TCP
          port: 8080
