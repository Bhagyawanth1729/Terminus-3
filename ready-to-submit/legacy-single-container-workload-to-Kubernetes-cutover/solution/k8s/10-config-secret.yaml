apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-upload-config
  namespace: claims-upload
data:
  UPLOAD_ROOT: /var/claims/uploads
  MAX_UPLOAD_MB: "64"
  LOG_LEVEL: info
---
apiVersion: v1
kind: Secret
metadata:
  name: claims-upload-secret
  namespace: claims-upload
type: Opaque
stringData:
  DB_PASSWORD: rotated-db-password
  SIGNING_KEY: rotated-signing-key
