version = "2.0"
name = "legacy-single-container-workload-to-Kubernetes-cutover"
category = "Software"
subcategory = "Systems"
tags = ["kubernetes", "migration", "workloads", "storage", "reliability"]
languages = ["yaml", "bash"]
difficulty = "frontier"
expert_time_estimate_hours = 10
artifacts = ["/app/k8s"]

[metadata]
author_name = "anonymous"
