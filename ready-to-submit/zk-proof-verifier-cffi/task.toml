difficulty_explanation = """\
Agents must diagnose and repair a multi-language ZK credential verification pipeline spanning Go, Rust, and Python. \
Go acts as the API gateway calling a Rust cryptographic proof engine via CGO/C-FFI, while Python generates witness payloads. \
Three interacting defects exist across language boundaries: \
1) Go passes scalar field parameters as big-endian unpadded byte arrays into Rust C-FFI, whereas Rust expects 32-byte fixed little-endian Montgomery scalar representation; \
2) Rust's C-FFI entry point panics on invalid point coordinates instead of catching panics via std::panic::catch_unwind and returning an integer error code, causing Go runtime thread crashes; \
3) Python witness generator omits domain separator prefixes during Merkle leaf hash serialization, breaking digest compatibility with Rust verifiers. \
Partial fixes (e.g., fixing Python serialization without handling Rust FFI panic safety or Go byte-order conversion) fail holdout stress tests.\
"""

solution_explanation = """\
1. In Go gateway (`gateway/verifier_cgo.go`), pad scalar byte slices to 32 bytes and reverse byte ordering to little-endian before invoking CGO calls to Rust. \
2. In Rust verifier (`librust_verifier/src/lib.rs`), wrap the C-FFI exported function `zk_verify_proof_c` in `std::panic::catch_unwind` to intercept Rust panics from malformed curve inputs, returning error code `-1` instead of unwinding across FFI; handle conversion from little-endian bytes to BN254 Fr scalar points. \
3. In Python witness generator (`python_witness/witness_gen.py`), add the `LEAF:` domain separator prefix to Merkle leaf node hashing. \
4. Rebuild Rust dynamic library `librust_verifier.so`, rebuild Go binary `gateway`, and verify the credential verification test suite.\
"""

verification_explanation = """\
The verifier runs in a separate container and checks the rebuilt multi-language system against three independent failure axes: \
1) Exact cryptographic proof verification for valid credential assertions generated by Python and verified by Rust via Go CGO; \
2) FFI crash safety: passing invalid/malformed scalar points must return status `-1` cleanly without crashing the process; \
3) Holdout witness verification: test against held-out zero-knowledge proof datasets to ensure correct domain separation and byte ordering under multi-asset scenarios.\
"""

relevant_experience = """\
Author has extensive experience in systems engineering, cross-language FFI (CGO/PyO3/C-FFI), zero-knowledge cryptography, and multi-threaded service debugging.\
"""

