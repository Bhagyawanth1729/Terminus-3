version = "2.0"
name = "depot-transfer-ledger"
category = "Software"
subcategory = "Languages"
tags = ["cobol", "ledger", "batch", "inventory"]
languages = ["cobol", "bash"]
difficulty = "advanced"
expert_time_estimate_hours = 6
artifacts = [
  "/app/x",
  "/app/output",
]

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"

[verifier]
timeout_sec = 1800
environment_mode = "separate"

[agent]
timeout_sec = 5400

[environment]
network_mode = "no-network"
build_timeout_sec = 900
cpus = 2
memory_mb = 8192
storage_mb = 10240
workdir = "/app/x"
